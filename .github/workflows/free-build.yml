name: Free personal iPhone build
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: personal-native-build
  cancel-in-progress: false
jobs:
  native:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: brew install xcodegen
      - name: Check custom trainer camera audio memory and asset cache
        run: bash app/Scripts/check_interaction_audio.sh
      - name: Check airplane controls
        run: bash app/Tests/run_airplane_controls.sh
      - name: Verify build inputs
        run: python3 app/Scripts/fetch_release_inputs.py
      - name: Install Metal compiler if required
        run: xcrun -sdk iphoneos metal --version > /dev/null 2>&1 || xcodebuild -downloadComponent MetalToolchain
      - name: Compile updated personal iPhone app
        env:
          PG_DEFAULT_ASSET_SERVER: http://192.168.1.115:8000
          JOBS: '3'
        run: bash build_ipa.sh --mirror app/Build/Inputs/mirror
      - name: Verify downloaded file streaming
        run: bash app/Scripts/check_local_streaming.sh
      - name: Deliver IPA and diagnostics privately
        if: always()
        env:
          PRIVATE_DELIVERY_TOKEN: ${{ secrets.PRIVATE_DELIVERY_TOKEN }}
          BUILD_RESULT: ${{ job.status }}
        run: python3 private_delivery.py
