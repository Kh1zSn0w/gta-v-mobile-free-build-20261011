name: Build personal GTA V Mobile
on:
  workflow_dispatch:
    inputs:
      verify_only:
        description: Run simulator and regression verification only
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ${{ inputs.verify_only && 'personal-ui-verification' || 'personal-native-build' }}
  cancel-in-progress: false
jobs:
  preview:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: brew install xcodegen
      - name: Verify trainer, wardrobe, saves, memory and settings migration
        run: bash app/Scripts/check_personal_mods.sh
      - name: Build and capture personal launcher
        run: bash app/UIPreview/capture.sh
      - name: Verify launcher, new controls and personal mods
        run: bash app/UIPreview/test.sh
      - name: Preserve UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: personal-ui-verification
          path: |
            app/UIPreview/ui-tests.log
            app/UIPreview/preview-build.log
            app/UIPreview/Screenshots
          if-no-files-found: ignore
          retention-days: 7
  native:
    if: ${{ !inputs.verify_only }}
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: brew install xcodegen
      - name: Verify personal mods and settings migration
        run: bash app/Scripts/check_personal_mods.sh
      - name: Fetch and checksum pinned build inputs
        run: python3 app/Scripts/fetch_release_inputs.py
      - name: Install Metal compiler if required
        run: xcrun -sdk iphoneos metal --version > /dev/null 2>&1 || xcodebuild -downloadComponent MetalToolchain
      - name: Build personal iPhone app from Kevin 1.3.3
        env:
          PG_INPUT_MIRROR: Build/Inputs/mirror
          JOBS: '2'
        run: bash build_ipa.sh http://192.168.1.115:8000
      - name: Deliver app and diagnostics to the private repository
        if: always()
        env:
          PRIVATE_DELIVERY_TOKEN: ${{ secrets.PRIVATE_DELIVERY_TOKEN }}
          BUILD_RESULT: ${{ job.status }}
        run: python3 private_delivery.py
