name: GTA V MOBILE
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gta-v-mobile-night
  cancel-in-progress: true
jobs:
  native:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - name: Check Swift
        run: bash app/Tests/check_swift.sh
      - name: Check engine helpers
        run: bash app/Scripts/check_interaction_audio.sh
      - name: Prepare inputs
        run: python3 app/Scripts/fetch_release_inputs.py
      - name: Prepare shaders
        env:
          PRIVATE_DELIVERY_TOKEN: ${{ secrets.PRIVATE_DELIVERY_TOKEN }}
        run: python3 app/Scripts/fetch_verified_shaders.py
      - name: Prepare Metal
        run: xcrun -sdk iphoneos metal --version > /dev/null 2>&1 || xcodebuild -downloadComponent MetalToolchain
      - name: Build
        env:
          PG_DEFAULT_ASSET_SERVER: http://192.168.1.115:8000
          JOBS: '3'
          PG_REUSE_VERIFIED_SHADERS: '1'
        run: bash build_ipa.sh --mirror app/Build/Inputs/mirror
      - name: Check streaming
        run: bash app/Scripts/check_local_streaming.sh
      - name: Deliver
        if: always()
        env:
          PRIVATE_DELIVERY_TOKEN: ${{ secrets.PRIVATE_DELIVERY_TOKEN }}
          BUILD_RESULT: ${{ job.status }}
        run: python3 private_delivery.py
  controls:
    runs-on: macos-15
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Check Swift
        run: bash app/Tests/check_swift.sh
      - name: Start simulator
        timeout-minutes: 6
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); v=[x for g in d["devices"].values() for x in g if x["name"].startswith("iPhone")]; print(next((x["udid"] for x in v if "SE" in x["name"]),v[0]["udid"]))')
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
          echo "$DEVICE" > /tmp/gta-device
      - name: Check controls
        run: bash app/Tests/run_airplane_controls.sh "$(cat /tmp/gta-device)"
      - name: Check performance mode
        run: bash app/Tests/performance_policy.sh "$(cat /tmp/gta-device)"
      - name: Capture UI
        run: bash app/Tests/night_preview.sh "$(cat /tmp/gta-device)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: UI
          path: app/Build/Screenshots
          retention-days: 3
